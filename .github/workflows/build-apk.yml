name: Build AT Music APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon 2>&1 | tee build.log; then
            # Surface the real errors as an annotation so they show on the run page.
            errors=$(grep -E "^e: |What went wrong|^> |error:" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${errors}"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AT-Music-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AT-Music.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AT-Music.apk \
            --title "AT Music (latest build)" \
            --notes "Phone par AT-Music.apk download karke install kijiye. Build from ${GITHUB_SHA::7}."
